name: Promote to production

# main is the staging trigger - Netlify auto-deploys luzhanqi-staging on
# every push here. This workflow waits for that deploy to go live, smoke
# tests it, and only then fast-forwards `production` (the prod trigger,
# which the luzhanqi site deploys from) to match - so prod only ever gets a
# commit that staging has already proven out.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  STAGING_SITE_ID: df1fd67b-41bd-429a-a6fd-7be5c05c3812
  STAGING_URL: https://luzhanqi-staging.netlify.app

jobs:
  wait-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit's staging deploy to be ready
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            STATE=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$STAGING_SITE_ID/deploys?per_page=10" \
              | jq -r --arg sha "$SHA" '[.[] | select(.commit_ref == $sha)][0].state // "not-found"')
            echo "Deploy state for $SHA: $STATE"
            if [ "$STATE" = "ready" ]; then
              exit 0
            fi
            if [ "$STATE" = "error" ]; then
              echo "Staging deploy failed."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for staging deploy to be ready."
          exit 1

      # cheap precheck - fails in seconds if the deploy is fundamentally
      # broken, without paying for a browser install first. It can only see
      # the served shell, though, which is why the playthrough below exists.
      - name: Smoke test staging
        run: |
          code=$(curl -s -o /tmp/staging_body.html -w '%{http_code}' "$STAGING_URL/")
          if [ "$code" != "200" ]; then
            echo "GET / returned $code, expected 200"
            exit 1
          fi
          if ! grep -q 'id="root"' /tmp/staging_body.html; then
            echo "Response body did not contain the expected root element"
            exit 1
          fi
          echo "Staging smoke test passed."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # drives two browsers through a real game on staging: host creates,
      # guest joins by code, both place boards, moves cross the socket, and a
      # forfeit ends it. Anything that only breaks after hydration - or only
      # breaks for the joining player - fails here rather than in production.
      - name: Play a game against staging
        env:
          E2E_BASE_URL: ${{ env.STAGING_URL }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  promote:
    needs: wait-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward production to this commit
        run: git push origin HEAD:production
